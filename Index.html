<html lang="en">
<head>

    <title>For Priti, From My Heart 💖</title>
    <link rel="stylesheet" href="style.css">
</head>

    <canvas id="fx-canvas"></canvas>

    <div class="audio-control" id="audio-toggle" role="button" aria-label="Toggle Sound">
        <span id="audio-icon">🎵</span>
    </div>

    <div id="achievement-toast" class="toast hidden">
        <div class="toast-icon">🏆</div>
        <div class="toast-content">
            <h4 id="toast-title">Achievement Unlocked!</h4>
            <p id="toast-desc">You found a secret!</p>
        </div>
    </div>

            <div class="glass-card">
                <span class="badge">FROM MY HEART 💖</span>
                <h1 class="main-title">Will you be my friend forever, <span class="highlight-name" id="friend-name">Priti</span>?</h1>
                <p class="subtitle">
                    I know you might not think of me as your closest friend...<br>
                    <strong>but I am truly, honestly yours. 🥺❤️</strong>
                </p>
                
                <div class="button-group">
                    <button id="btn-yes" class="btn btn-yes">YES ❤️</button>
                    <button id="btn-no" class="btn btn-no">NO 🙈</button>
                </div>
                <p id="no-counter-hint" class="hint-text"></p>
            </div>
        </section>

                <p class="subtitle">Thank you for accepting me... ❤️</p>
